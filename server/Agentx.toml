[project]
inspire    = "laravel-octane-tenancy-api"
tests      = true
max_rounds = 5
max_fixes  = 5

[gate]
timeout = 900
command = "composer verify"

[agent]
timeout    = 10000
manager    = "claude"
architects = ["claude"]
executors  = ["claude"]
testers    = ["claude"]

[claude]
model = "opus"
effort = "max"

[codex]
model = "gpt-5-codex"
effort = "high"
