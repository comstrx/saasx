name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'platform/mobile/**'
      - 'engine/bun/**'
      - '.github/workflows/mobile.yml'

  pull_request:
    paths:
      - 'platform/mobile/**'
      - 'engine/bun/**'
      - '.github/workflows/mobile.yml'

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: platform/mobile

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: platform/mobile/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install the engine
        run: bun install --frozen-lockfile
        working-directory: engine/bun

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Export
        run: bun run export
