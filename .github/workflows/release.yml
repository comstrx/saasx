name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  AUDITABLE: cargo-auditable@0.7.7

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          tag="$(bash scripts/release.sh plan ${TAG:+--tag "${TAG}"})"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  global:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/global.yml

  rust:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/rust.yml

  bun:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/bun.yml

  api:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/api.yml

  infra:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/infra.yml

  skill:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/skill.yml

  web:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/web.yml

  mobile:
    needs: plan
    if: github.event_name == 'push'
    uses: $/.github/workflows/mobile.yml

  build:
    name: ${{ matrix.target }}
    needs: [plan, global, rust, bun, api, infra, skill, web, mobile]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Install cargo-auditable
        run: cargo binstall --no-confirm "${AUDITABLE}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release.sh build --target "${TARGET}" --tag "${TAG}" --repo "${REPO}" --out "${RUNNER_TEMP}/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  seal:
    name: seal
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write # signs the provenance of every asset
      attestations: write # stores that provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: SBOM
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: syft scan dir:. --config .syft.yml --source-name saasx --source-version "${TAG}" --output "cyclonedx-json=${RUNNER_TEMP}/dist/sbom.cdx.json"

      - name: Seal
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release.sh seal --tag "${TAG}" --repo "${REPO}" --out "${RUNNER_TEMP}/dist"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [plan, seal]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # drafts, uploads and publishes the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release.sh publish --tag "${TAG}" --repo "${REPO}" --out "${RUNNER_TEMP}/dist"

  verify:
    name: verify (${{ matrix.os }})
    needs: [plan, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release.sh verify --tag "${TAG}" --repo "${REPO}"

  engines:
    name: ${{ matrix.repo }}
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        repo: [rustx, bunx]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.TOOLX_TOKEN }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/extract.sh release "${REPO}" "${TAG}" --dist "${RUNNER_TEMP}/toolx"

  parts:
    name: ${{ matrix.repo }}
    needs: [plan, engines]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        repo: [apix, infrax, skillx, webx, mobilex]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.TOOLX_TOKEN }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/extract.sh release "${REPO}" "${TAG}" --dist "${RUNNER_TEMP}/toolx"
