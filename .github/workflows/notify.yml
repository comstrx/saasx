name: Notify

on:
  workflow_run:
    workflows: [API, Bun, Daily, Global, Infra, Labeler, Labels, Mobile, Release, Rust, Skill, Web]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: notify-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  notify:
    name: notify
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read # names the failed jobs of the reported run
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: aliasx.sh
          sparse-checkout-cone-mode: false

      - name: Report
        if: github.event_name == 'workflow_run'
        run: bash aliasx.sh report

      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: bash aliasx.sh notify "🔔 ${GITHUB_REPOSITORY##*/} · Notify test"
