name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: What to run
        options: [verify, plan, release, destroy]
        default: verify

      stack:
        type: choice
        description: The stack it acts on
        options: [light, full]
        default: light

      accept_cves:
        type: boolean
        description: Accept the CRITICAL findings this release carries
        default: false

  push:
    branches: [main]
    paths-ignore: ['deploy/**']

permissions: {}

defaults:
  run:
    shell: bash

# each secret by name — a public repo holds toJSON(secrets) for approval, and infrax reads the process env first anyway
env:
  STACK: ${{ inputs.stack || 'light' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
  POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
  PGADMIN4_PASSWORD: ${{ secrets.PGADMIN4_PASSWORD }}
  TOOLS_PASSWORD: ${{ secrets.TOOLS_PASSWORD }}
  SERVICE_LARAVEL_ENV_FILE: ${{ secrets.SERVICE_LARAVEL_ENV_FILE }}

jobs:
  verify:
    if: github.event_name == 'push' || inputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: comstrx/infrax@v0.2.4
      - uses: opentofu/setup-opentofu@v2

      - name: Verify
        run: infrax ci verify

  plan:
    if: inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: comstrx/infrax@v0.2.4
      - uses: opentofu/setup-opentofu@v2

      - name: Plan
        run: infrax tofu init && infrax tofu plan

  release:
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.verify.result == 'success') || inputs.action == 'release') }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      actions: read

    concurrency:
      group: release-${{ inputs.stack || 'light' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - uses: comstrx/infrax@v0.2.4

      - name: Gate on CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: infrax ci gate

      - uses: opentofu/setup-opentofu@v2

      - name: Release
        env:
          CVE_ALLOW: ${{ inputs.accept_cves || false }}
        run: infrax -y ci release

      - name: Outcome
        if: always()
        run: infrax ci outcome "${{ job.status }}"

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    concurrency:
      group: release-${{ inputs.stack }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - uses: comstrx/infrax@v0.2.4
      - uses: opentofu/setup-opentofu@v2

      - name: Destroy
        env:
          TOFU_ALLOW_DESTROY: 'true'
          INFRAX_CONFIRM: ${{ inputs.stack }}
        run: |
          [[ "${STACK}" != "full" ]] || infrax k8s kubeconfig
          infrax -y tofu destroy
