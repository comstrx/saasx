name: Infra

on:
  push:
    branches: [ main ]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Toolchain setup and the part's `verify` gate are wired when the part lands.

      - name: Verify
        run: echo "infra — no gate yet"
