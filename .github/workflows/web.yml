name: Web

on:
  push:
    branches: [main]
    paths:
      - 'platform/web/**'
      - '.github/workflows/web.yml'

  pull_request:
    paths:
      - 'platform/web/**'
      - '.github/workflows/web.yml'

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: platform/web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Toolchain setup and the part's `verify` gate are wired when the part lands.

      - name: Verify
        run: echo "web — no gate yet"
