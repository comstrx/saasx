name: Daily

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: engine/rust

jobs:
  sanitizer:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, msan, lsan]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: engine/rust

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: cargo xtask sanitizer --sanitizer "${SANITIZER}"

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: engine/rust

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Miri
        run: cargo xtask miri

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: engine/rust

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Fuzz
        run: cargo xtask fuzz --run --budget 3600
