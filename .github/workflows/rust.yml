name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'engine/rust/**'
      - '.github/workflows/rust.yml'

  pull_request:
    paths:
      - 'engine/rust/**'
      - '.github/workflows/rust.yml'

  workflow_dispatch:

  workflow_call:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: engine/rust

jobs:
  gates:
    name: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: engine/rust

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask gates
