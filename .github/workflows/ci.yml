name: CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PRETTIER: prettier@3.8.1
  TAPLO: taplo-cli@0.10.0

jobs:
  leaks:
    name: Leaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  vulns:
    name: vulns
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: Trivy
        run: trivy fs . --config .trivy.yml --exit-code 1

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Syft
        run: syft scan dir:. --config .syft.yml --source-name saasx --output cyclonedx-json=sbom.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  actions:
    name: actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          config: .zizmor.yml
          persona: pedantic
          advanced-security: false

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .typos.toml

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Install taplo
        run: cargo binstall --no-confirm "${TAPLO}"

      - name: Taplo
        run: taplo fmt --check && taplo lint

      - name: Prettier
        run: bunx "${PRETTIER}" --config .prettierrc.yml --ignore-path .gitignore --no-error-on-unmatched-pattern --check "**/*.{md,mdx,yml,yaml,json,jsonc}"

  gate:
    name: gate
    if: always()
    needs: [leaks, vulns, sbom, actions, spelling, formatting]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=0

          while IFS='=' read -r job result; do
              printf '%-10s %s\n' "${result}" "${job}"
              [[ "${result}" == "success" ]] || failed=1
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "${RESULTS}")

          (( failed == 0 )) || { echo "gate: required jobs did not succeed." >&2; exit 1; }
