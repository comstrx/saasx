name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: laravel

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, redis, pcntl
          coverage: none

      - name: Install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Style
        run: vendor/bin/pint --test

      - name: Test
        run: cp .env.example .env && php artisan key:generate --ansi && php artisan test

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and build
        run: test -z "$(gofmt -l .)" && go vet ./... && go build ./...

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format and lint
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: node

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install and check
        run: npm ci --no-audit --no-fund && npm run check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync and import
        run: uv sync --frozen --python 3.14 && uv run --frozen python -c "import main"
