          - '*'

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: '03:30'

    open-pull-requests-limit: 10
    rebase-strategy: auto

    labels:
      - client
      - dependencies

    commit-message:
      prefix: 'deps(client)'

    groups:
      client-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: '03:40'

    open-pull-requests-limit: 10
    rebase-strategy: auto

    labels:
      - mobile
      - dependencies

    commit-message:
      prefix: 'deps(mobile)'

    groups:
      mobile-deps:
        patterns:
          - '*'
