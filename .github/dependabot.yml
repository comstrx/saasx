version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'

    open-pull-requests-limit: 10
    rebase-strategy: auto

    labels:
      - workflow
      - automation

    commit-message:
      prefix: 'deps(ci)'

    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: '03:50'

    open-pull-requests-limit: 10
    rebase-strategy: auto

    labels:
      - engine
      - dependencies

    commit-message:
      prefix: 'deps(engine)'

    groups:
      engine-deps:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
