version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "global(deps)"

  # Uncomment each entry when its part has a manifest; Dependabot errors on an empty directory.

