name: postgresql
mode: cluster
image: postgres:18.6-alpine
port: 5432
user: 70
address: ""

env:
  POSTGRES_USER: "infrax"
  POSTGRES_DB: postgres
  PGDATA: /var/lib/postgresql/data/pgdata
  POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --encoding=UTF8"

secretEnv:
  POSTGRES_PASSWORD: ROOT_PASSWORD

dataPath: /var/lib/postgresql/data

probe:
  exec:
    command: [pg_isready, -U, "infrax", -h, 127.0.0.1]

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 2Gi }

storage:
  class: local-path
  size: 20Gi

clients: ["laravel", "go", "python", "pgadmin4"]
metricsNamespace: monitoring

scripts:
  backup.sh: |
    #!/bin/sh
    set -eu
    
    export PGPASSWORD="${ROOT_PASSWORD}"
    
    stamp="$(date -u +%Y%m%d-%H%M%S)"
    
    for database in ${DATABASES:-}; do
    
        mkdir -p "${OUT}/${database}"
        pg_dump -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -d "${database}" --no-owner --no-privileges -Fc -f "${OUT}/${database}/${stamp}.dump"
        echo "postgresql: ${database} → ${stamp}.dump ($(wc -c < "${OUT}/${database}/${stamp}.dump") bytes)"
    
    done
  provision.sh: |
    #!/bin/sh
    set -eu
    
    export PGPASSWORD="${ROOT_PASSWORD}"
    
    tries=0
    
    until pg_isready -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -q; do
    
        tries=$((tries + 1))
        [ "${tries}" -lt 90 ] || { echo "postgresql at ${HOST}:${PORT} never accepted a connection"; exit 1; }
        sleep 2
    
    done
    
    psql -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -d postgres -v ON_ERROR_STOP=1 -q \
        -v role="${SERVICE_USER}" -v password="${SERVICE_PASSWORD}" -v database="${SERVICE_DATABASE}" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'password') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
    SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'role', :'password') \gexec
    SELECT format('GRANT %I TO %I', :'role', current_user) WHERE NOT pg_has_role(current_user, :'role', 'MEMBER') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'database') \gexec
    SQL
    
    for extension in ${EXTENSIONS:-}; do
    
        psql -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -d "${SERVICE_DATABASE}" -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS \"${extension}\""
    
    done
    
    echo "postgresql: ${SERVICE_USER} owns ${SERVICE_DATABASE}"
  restore.sh: |
    #!/bin/sh
    set -eu
    
    export PGPASSWORD="${ROOT_PASSWORD}"
    
    [ "${TARGET}" != "${SOURCE}" ] || { echo "refusing to restore over '${SOURCE}' — promotion is a deliberate act"; exit 1; }
    [ -s "${FILE}" ] || { echo "backup '${STAMP}' of '${SOURCE}' not found"; exit 1; }
    
    psql -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -d postgres -v ON_ERROR_STOP=1 -q -v database="${TARGET}" <<'SQL'
    SELECT format('CREATE DATABASE %I', :'database') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
    SQL
    
    pg_restore --clean --if-exists --single-transaction --exit-on-error --no-owner --no-privileges \
        -h "${HOST}" -p "${PORT}" -U "${ROOT_USER}" -d "${TARGET}" "${FILE}"
    
    echo "postgresql: ${SOURCE} ${STAMP} restored into ${TARGET} — verify it, then promote deliberately"

init: {}

backup:
  enabled: true
  schedule: "0 3 * * *"
  target: object
  databases: ["laravel", "go", "python"]
  prefix: "saasx/postgresql"
  account: {}
  keepDays: 30
  uploader:
    image: amazon/aws-cli:2.36.42
    command: ["sh", "-c", "aws s3 cp --recursive --only-show-errors \"$WORK\" \"s3://$BUCKET/$PREFIX/\""]
    env: {"BUCKET": "saasx-backups-04b8af", "AWS_DEFAULT_REGION": "eu-north-1"}
  storage:
    class: local-path
    size: 20Gi
