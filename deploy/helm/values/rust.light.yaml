name: rust
runtime: rust

image:
  repository: 031871827635.dkr.ecr.eu-north-1.amazonaws.com/saasx/rust
  tag: "84ce322d1115"
  pullPolicy: IfNotPresent

imagePullSecrets: [pull-secret]

user: 65532
port: 8080
probe: http
health: "/health"

env:
  RUST_LOG: "info"

processes:
  web:
    command: []
    port: 8080
    route: ""
    replicas: 1
    grace: 30
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

autoscaling:
  min: 1
  max: 2
  cpu: 75

rollout:
  surge: 0
  unavailable: 1

storage:
  enabled: false
  class: local-path
  size: 10Gi
  mount: "/data"

route:
  enabled: false
  gateway: gateway
  gatewayNamespace: gateway
  sectionName: https
  hostnames: []

netpol:
  proxyNamespace: envoy-gateway-system
  metricsNamespace: "monitoring"
  callers: ["laravel", "go"]

migrate:
  command: []

provision: []

metrics:
  path: ""

serviceAccount:
  annotations: {}
