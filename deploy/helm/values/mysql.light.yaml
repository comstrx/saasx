name: mysql
mode: cluster
image: mysql:8.4.11
port: 3306
user: 999
address: ""

env:
  MYSQL_USER: "infrax"

secretEnv:
  MYSQL_ROOT_PASSWORD: ROOT_PASSWORD
  MYSQL_PASSWORD: ROOT_PASSWORD

dataPath: /var/lib/mysql

probe:
  exec:
    command: [mysqladmin, ping, -h, 127.0.0.1, --silent]

resources:
  requests: { cpu: 100m, memory: 768Mi }
  limits: { memory: 2Gi }

storage:
  class: local-path
  size: 20Gi

clients: ["node", "phpmyadmin"]
metricsNamespace: monitoring

scripts:
  backup.sh: |
    #!/bin/sh
    set -eu
    
    export MYSQL_PWD="${ROOT_PASSWORD}"
    
    stamp="$(date -u +%Y%m%d-%H%M%S)"
    
    for database in ${DATABASES:-}; do
    
        mkdir -p "${OUT}/${database}"
        mysqldump -h "${HOST}" -P "${PORT}" -u "${ROOT_USER}" --single-transaction --routines --triggers --set-gtid-purged=OFF \
            --result-file="${OUT}/${database}/${stamp}.sql" "${database}"
        echo "mysql: ${database} → ${stamp}.sql ($(wc -c < "${OUT}/${database}/${stamp}.sql") bytes)"
    
    done
  provision.sh: |
    #!/bin/sh
    set -eu
    
    export MYSQL_PWD="${ROOT_PASSWORD}"
    
    tries=0
    
    until mysqladmin ping -h "${HOST}" -P "${PORT}" -u "${ROOT_USER}" --silent; do
    
        tries=$((tries + 1))
        [ "${tries}" -lt 90 ] || { echo "mysql at ${HOST}:${PORT} never accepted a connection"; exit 1; }
        sleep 2
    
    done
    
    mysql -h "${HOST}" -P "${PORT}" -u "${ROOT_USER}" <<SQL
    CREATE DATABASE IF NOT EXISTS \`${SERVICE_DATABASE}\`;
    CREATE USER IF NOT EXISTS '${SERVICE_USER}'@'%' IDENTIFIED BY '${SERVICE_PASSWORD}';
    ALTER USER '${SERVICE_USER}'@'%' IDENTIFIED BY '${SERVICE_PASSWORD}';
    GRANT ALL PRIVILEGES ON \`${SERVICE_DATABASE}\`.* TO '${SERVICE_USER}'@'%';
    FLUSH PRIVILEGES;
    SQL
    
    echo "mysql: ${SERVICE_USER} owns ${SERVICE_DATABASE}"
  restore.sh: |
    #!/bin/sh
    set -eu
    
    export MYSQL_PWD="${ROOT_PASSWORD}"
    
    [ "${TARGET}" != "${SOURCE}" ] || { echo "refusing to restore over '${SOURCE}' — promotion is a deliberate act"; exit 1; }
    [ -s "${FILE}" ] || { echo "backup '${STAMP}' of '${SOURCE}' not found"; exit 1; }
    
    mysql -h "${HOST}" -P "${PORT}" -u "${ROOT_USER}" -e "CREATE DATABASE IF NOT EXISTS \`${TARGET}\`"
    mysql -h "${HOST}" -P "${PORT}" -u "${ROOT_USER}" "${TARGET}" < "${FILE}"
    
    echo "mysql: ${SOURCE} ${STAMP} restored into ${TARGET} — verify it, then promote deliberately"

init:
  grant.sql: |
    GRANT ALL PRIVILEGES ON *.* TO 'infrax'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;

backup:
  enabled: true
  schedule: "0 3 * * *"
  target: object
  databases: ["node"]
  prefix: "saasx/mysql"
  account: {}
  keepDays: 30
  uploader:
    image: amazon/aws-cli:2.36.42
    command: ["sh", "-c", "aws s3 cp --recursive --only-show-errors \"$WORK\" \"s3://$BUCKET/$PREFIX/\""]
    env: {"BUCKET": "saasx-backups-04b8af", "AWS_DEFAULT_REGION": "eu-north-1"}
  storage:
    class: local-path
    size: 20Gi
