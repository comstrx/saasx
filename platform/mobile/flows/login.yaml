appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 20000
- tapOn:
    id: "email"
- inputText: ${ADMIN_EMAIL}
- tapOn:
    id: "password"
- inputText: ${ADMIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: "continue"
- extendedWaitUntil:
    visible:
      id: "otp"
    timeout: 15000
- tapOn:
    id: "otp"
- inputText: ${OTP}
- hideKeyboard
- tapOn:
    id: "verify"
- extendedWaitUntil:
    visible:
      id: ${LANDING}
    timeout: 20000
