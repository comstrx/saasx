include = ["**/*.toml"]
exclude = [
    "**/.git/**",
    "**/.idea/**",
    "**/.vscode/**",
    "**/.fleet/**",
    "**/.zed/**",
    "**/.claude/**",
    "**/.codex/**",
    "**/.agents/**",
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/out/**",
    "**/.next/**",
    "**/.expo/**",
    "**/.turbo/**",
    "**/.cache/**",
    "**/.vite/**",
    "**/coverage/**",
    "**/Pods/**",
    "**/.gradle/**",
    "**/vendor/**",
    "**/*.lock",
    "**/Cargo.toml",
    "**/supply-chain/**",
]

[formatting]
indent_string = "    "
column_width = 100

trailing_newline = true
align_entries = false
align_comments = false

allowed_blank_lines = 1
crlf = false
