rules:
  forbidden-uses:
    config:
      allow:
        - actions/checkout
        - actions/setup-node
        - actions/upload-artifact
        - actions-rust-lang/setup-rust-toolchain
        - anchore/sbom-action/download-syft
        - aquasecurity/setup-trivy
        - cargo-bins/cargo-binstall
        - crate-ci/typos
        - gitleaks/gitleaks-action
        - oven-sh/setup-bun
        - zizmorcore/zizmor-action
    remap:
      severity: high

  unpinned-uses:
    config:
      policies:
        '*': hash-pin
    remap:
      severity: high
